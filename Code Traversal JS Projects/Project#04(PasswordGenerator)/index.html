<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
    <link href="style.css" rel="stylesheet"/>
</head>
<body>
    <div class="container">
        <h1>Password Generator</h1>

        <div class="inputBox">
            <input type="text" class="passBox" disabled id="passBox"/>
            <span class="material-icons" id="copyIcon">content_copy</span>
        </div>

        <input type="range" min="1" max="30" value="8" id="inputSlider"/>

        <div class="row">
            <p>Password Length</p>
            <span id="sliderValue">4</span>
        </div>

        <div class="row">
            <label for="lowercase">Include Lowercase Letters (a-z)</label>
            <input type="checkbox" id="lowercase" name="lowercase" checked/>
        </div>
        <div class="row">
            <label for="uppercase">Include Uppercase Letters (A-Z)</label>
            <input type="checkbox" id="uppercase" name="uppercase" checked/>
        </div>
        <div class="row">
            <label for="numbers">Include Number (0-9)</label>
            <input type="checkbox" id="numbers" name="numbers" checked/>
        </div>
        <div class="row">
            <label for="symbols">Include Symbols (@-*)</label>
            <input type="checkbox" id="symbols" name="symbols" checked/>
        </div>
        
        <button type="button" class="genBtn" id="genBtn">Generate Password</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
